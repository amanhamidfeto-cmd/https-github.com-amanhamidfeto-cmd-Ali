<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Market</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <h1 id="title">Addis Market</h1>

  <form id="add-form">
    <input
      type="text"
      id="name"
      placeholder="Item name"
    >

    <input
      type="number"
      id="price"
      placeholder="Price in ETB"
    >

    <button type="submit">Add Item</button>
  </form>

  <ul id="list"></ul>

  <h2>Total: <span id="total">0</span> ETB</h2>

  <script src="aman.js"></script>
</body>
</html>
